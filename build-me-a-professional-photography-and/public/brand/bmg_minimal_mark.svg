  <text x="340" y="662" text-anchor="middle" font-size="9" letter-spacing="5" fill="#aaa" style="fill:rgb(170, 170, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Cormorant SC&quot;, Georgia, serif;font-size:9px;font-weight:400;text-anchor:middle;dominant-baseline:auto">BRANDON  MEDIA  GROUP</text>

